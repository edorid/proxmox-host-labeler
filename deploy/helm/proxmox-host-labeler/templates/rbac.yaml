apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "proxmox-host-labeler.fullname" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "proxmox-host-labeler.fullname" . }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "proxmox-host-labeler.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "proxmox-host-labeler.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "proxmox-host-labeler.fullname" . }}
    namespace: {{ .Release.Namespace }}
